<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DSH 遥控">
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="icon" href="/mobile/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/mobile/icon-192.png">
  <script src="/mobile/theme.js"></script>
  <link rel="stylesheet" href="/mobile/app.css">
  <title>DSH 远程控制</title>
</head>
<body>
  <div id="app" class="hidden">
    <header id="topbar">
      <button id="btn-sidebar" class="icon-btn" aria-label="打开会话侧栏" title="会话">☰</button>
      <div class="title-stack"><strong id="current-session-title">新会话</strong><span id="session-status" aria-live="polite">正在连接…</span></div>
      <button id="btn-refresh" class="connection-pill connecting" title="重新连接" aria-label="重新连接"><span id="connection-dot" class="connection-dot"></span><span id="connection-label">连接中</span></button>
    </header>
    <aside id="session-drawer" class="drawer" aria-label="会话导航" aria-hidden="true">
      <div class="drawer-head"><div class="brand" aria-label="DeepSeek Harness"><span class="brand-name">deepseek</span><span class="brand-tag">HARNESS</span></div><button id="btn-close-sidebar" class="icon-btn" aria-label="关闭侧栏">×</button></div>
      <button id="btn-new-session" class="new-session"><span>⊕</span> 新会话</button>
      <div class="drawer-section-head"><span>工作区</span><button id="btn-drawer-refresh" class="icon-btn small" aria-label="刷新会话">↻</button></div>
      <nav id="session-groups" class="session-groups"></nav>
      <div class="drawer-footer"><button id="nav-ssh" class="drawer-action hidden" data-page="ssh">终端 SSH</button><button id="nav-settings" class="drawer-action" data-page="settings">设置</button><button id="btn-logout" class="drawer-action danger-text">断开此设备</button></div>
    </aside>
    <button id="drawer-scrim" class="scrim hidden" aria-label="关闭侧栏"></button>
    <select id="session-select" class="visually-hidden" aria-label="选择会话"></select>
    <main id="chat-page" class="page chat-page"><section id="activity-banner" class="activity-banner hidden" aria-live="polite"><span id="activity-text"></span></section><div id="messages" class="messages"></div><section id="queue-dock" class="queue-dock hidden" aria-label="消息队列"><button id="queue-summary" class="queue-summary" type="button" aria-expanded="false"><span id="queue-summary-label">排队消息</span><span>⌄</span></button><div id="queue-items" class="queue-items"></div><button id="btn-steer-all" class="steer-all hidden" type="button">全部插话</button></section><form id="composer-form" class="composer"><textarea id="input" rows="2" placeholder="描述你想要构建的内容" enterkeyhint="send" autocomplete="off"></textarea><div class="composer-row"><div class="composer-tools"><button id="btn-command-menu" class="round-btn" type="button" aria-label="命令" title="命令" aria-expanded="false">＋</button><button id="btn-permission" class="context-chip" type="button" aria-label="权限预设"><span class="chip-icon">◇</span><span id="permission-label">权限</span></button><button id="btn-agent-preset" class="context-chip compact-chip" type="button" aria-label="Agent 模式"><span id="agent-preset-label">模式</span></button></div><div class="composer-actions"><button id="btn-model" class="model-chip" type="button"><span id="model-label">选择模型</span></button><button id="btn-cancel" class="cancel-btn hidden" type="button">停止</button><button id="btn-send" class="send-btn" type="submit" aria-label="发送消息" title="发送消息">↑</button></div></div></form></main>
    <main id="ssh-page" class="page secondary-page hidden"><div class="page-head"><button class="back-btn" data-page="chat">‹</button><h1>SSH 终端</h1></div><section class="settings-section"><label for="ssh-host">主机</label><select id="ssh-host"></select><label for="ssh-command">命令</label><textarea id="ssh-command" rows="4" spellcheck="false" placeholder="uname -a"></textarea><div class="grid-2"><div><label for="ssh-timeout">超时（秒）</label><input id="ssh-timeout" type="number" inputmode="numeric" min="1" max="300" value="60"></div><div><label for="ssh-workdir">远程目录</label><input id="ssh-workdir" type="text" placeholder="/opt/app" autocomplete="off" spellcheck="false"></div></div><button id="btn-ssh-run" class="primary full">执行</button></section><section class="settings-section"><div class="output-head"><strong id="ssh-output-title">输出</strong><span id="ssh-exit" class="badge hidden"></span></div><pre id="ssh-output">（尚未执行）</pre></section></main>
    <main id="settings-page" class="page secondary-page hidden"><div class="page-head"><button class="back-btn" data-page="chat">‹</button><h1>设置</h1></div><section class="settings-section"><h2>连接</h2><p class="muted">当前服务器：<code id="server-url"></code></p><p id="connection-detail" class="muted">正在检查连接…</p><p id="session-expiry" class="muted">正在读取配对有效期…</p><button id="btn-reconnect" class="secondary full">一键重连</button></section><section class="settings-section"><h2>默认工作区</h2><p id="workspace-description" class="muted"></p><label for="workspace-select">新会话默认位置</label><select id="workspace-select"></select><button id="btn-save-workspace" class="primary full">应用</button></section><section class="settings-section"><h2>外观</h2><p id="theme-description" class="muted"></p><label for="theme-select">颜色模式</label><select id="theme-select"><option value="system">跟随系统</option><option value="light">浅色模式</option><option value="dark">深色模式</option></select></section><section class="settings-section"><h2>设备与安全</h2><p class="muted">手机端不开放桌面凭据、文件管理或全局设置。主动断开或会话到期后需要重新扫码。</p><button id="btn-logout-settings" class="danger full">断开此设备</button></section></main>
    <div id="command-menu" class="command-menu hidden" role="menu" aria-label="命令"><div class="menu-title">命令</div><div id="command-list"></div></div><button id="popover-scrim" class="popover-scrim hidden" aria-label="关闭菜单"></button>
    <div id="sheet-layer" class="sheet-layer hidden" aria-hidden="true"><button id="sheet-scrim" class="sheet-scrim" aria-label="关闭"></button><section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><div><h2 id="sheet-title"></h2><p id="sheet-subtitle" class="muted"></p></div><button id="btn-close-sheet" class="icon-btn" aria-label="关闭">×</button></div><div id="sheet-content" class="sheet-content"></div></section></div>
    <div id="confirm-layer" class="modal-layer hidden" aria-hidden="true"><section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title">启用完全访问？</h2><p>完全访问会取消文件系统沙箱，并允许操作不再逐项询问。只应在你信任当前任务和工作区时启用。</p><label class="confirm-check"><input id="confirm-checkbox" type="checkbox"> 我了解此设置会扩大手机远程操作的权限</label><div class="confirm-actions"><button id="btn-confirm-cancel" class="secondary">取消</button><button id="btn-confirm-danger" class="danger" disabled>启用完全访问</button></div></section></div>
  </div>
  <div id="login" class="login"><div class="login-card"><h1>DSH 远程控制</h1><p class="muted">请从电脑上的配对页扫码连接</p><input id="login-token" type="password" placeholder="配对码" autocomplete="current-password"><button id="btn-login" class="primary full">连接</button><p id="login-error" class="error hidden"></p></div></div><div id="toast" class="toast hidden"></div><script src="/mobile/app.js" type="module"></script>
</body>
</html>
