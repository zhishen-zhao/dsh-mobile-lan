name: Bootstrap verified source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dsh-bootstrap.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq dsh-mobile-lan-source.zip -d .
          rm -f dsh-mobile-lan-source.zip .github/workflows/dsh-bootstrap.yml
      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial LAN mobile release"
          git push
